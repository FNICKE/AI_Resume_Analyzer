# Server Configuration
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?ssl=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI API Key (Optional. Standard rule-based fallback will handle offline scans)
gemini.api.key=${GEMINI_API_KEY}

# Dedicated AI API Key for Interview Preparation (If empty, falls back to gemini.api.key above)
gemini.interview.api.key=

# Default Gemini model (e.g. gemini-2.0-flash or gemini-2.5-flash)
gemini.model=${GEMINI_MODEL}

# OpenAI API Configuration (Used for Interview Preparation portal)
openai.api.key=${OPENAI_API_KEY}
openai.model=gpt-4o-mini


