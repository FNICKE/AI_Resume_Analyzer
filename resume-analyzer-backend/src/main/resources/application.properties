# Server Configuration
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resume_analyzer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sachin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI API Key (Optional. Standard rule-based fallback will handle offline scans)
gemini.api.key=${GEMINI_API_KEY:}

# Dedicated AI API Key for Interview Preparation (If empty, falls back to gemini.api.key above)
gemini.interview.api.key=

# Default Gemini model (e.g. gemini-2.0-flash or gemini-2.5-flash)
gemini.model=gemini-2.0-flash

# OpenAI API Configuration (Used for Interview Preparation portal)
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini
