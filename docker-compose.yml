version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: resume-analyzer-db
    restart: always
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sachin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./resume-analyzer-backend
      dockerfile: Dockerfile
    container_name: resume-analyzer-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./resume-analyzer-backend/.env
    depends_on:
      - db


volumes:
  pgdata:
